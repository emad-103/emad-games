    function normalizeFirebaseUrl(url) {
      let u = String(url || '').trim();
      if (!u) return '';
      u = u.replace(/\.json(\?.*)?$/i, '').replace(/\/+$/, '');
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      return u;
    }

    async function fbRequest(baseUrl, path, method = 'GET', payload = null) {
      const base = normalizeFirebaseUrl(baseUrl);
      if (!base) return null;
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (payload !== null) opts.body = JSON.stringify(payload);
      const res = await fetch(`${base}/${path}.json`, opts);
      if (!res.ok) throw new Error(`Firebase HTTP ${res.status}`);
      return await res.json();
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildShuffledRunQuiz(baseQuiz) {
      const shuffledQuestions = [];
      [1, 2, 3].forEach(lvl => {
        const lvlQs = shuffleArray(baseQuiz.questions.filter(q => q.level === lvl));
        lvlQs.forEach(q => {
          const isTF = q.type === 'tf' || q.options.length === 2;
          if (isTF) {
            shuffledQuestions.push({ ...q, options: [...q.options] });
          } else {
            const indexed = q.options.map((text, idx) => ({ text, isCorrect: idx === q.correctIndex }));
            const mixed = shuffleArray(indexed);
            const newCorrect = mixed.findIndex(item => item.isCorrect);
            shuffledQuestions.push({
              ...q,
              options: mixed.map(item => item.text),
              correctIndex: newCorrect >= 0 ? newCorrect : 0
            });
          }
        });
      });
      return { ...baseQuiz, questions: shuffledQuestions };
    }

    // ===================== 7. FILE INGESTION & EXCEL PARSER =====================
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          const base64 = dataUrl.split(',')[1] || '';
          resolve({ dataUrl, base64 });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function fileToText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsText(file, 'utf-8');
      });
    }

    async function ingestFile(file) {
      const name = file.name;
      const mime = file.type || 'application/octet-stream';
      const lower = name.toLowerCase();

      if (mime.startsWith('image/')) {
        const { dataUrl, base64 } = await fileToBase64(file);
        return { name, mime, dataUrl, base64, kind: 'image' };
      }
      if (mime === 'application/pdf' || lower.endsWith('.pdf')) {
        const { dataUrl, base64 } = await fileToBase64(file);
        return { name, mime: 'application/pdf', dataUrl, base64, kind: 'pdf' };
      }
      if (lower.endsWith('.docx') || mime === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
        if (!window.mammoth) throw new Error('مكتبة قراءة ملفات Word غير متوفرة حالياً.');
        const arrayBuffer = await file.arrayBuffer();
        const res = await window.mammoth.extractRawText({ arrayBuffer });
        return { name, mime: 'text/plain', dataUrl: '', base64: '', text: res.value, kind: 'docx' };
      }
      const text = await fileToText(file);
      return { name, mime: 'text/plain', dataUrl: '', base64: '', text, kind: 'text' };
    }

    async function parseExcelStudentNames(file) {
      if (!window.XLSX) throw new Error('مكتبة قراءة ملفات Excel غير محمّلة (تحقق من الاتصال بالإنترنت).');
      const data = await file.arrayBuffer();
      const workbook = window.XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      const headerKeywords = ['الاسم', 'اسم الطالب', 'اسم الطالبة', 'الطلاب', 'name', 'student', 'م', 'الرقم'];
      const names = [];
      rows.forEach((row, rIdx) => {
        if (!Array.isArray(row) || row.length === 0) return;
        let candidate = '';
        for (const cell of row) {
          const val = String(cell ?? '').trim();
          if (val && isNaN(Number(val)) && val.length >= 2) {
            candidate = val;
            break;
          }
        }
        if (!candidate) return;
        if (rIdx === 0 && headerKeywords.some(k => candidate.toLowerCase().includes(k))) return;
        names.push(candidate);
      });
      return Array.from(new Set(names));
    }

  "lessonTitle": "عنوان الدرس أو المهارة المستخرجة",
  "sourceSummary": "ملخّص موجز لمحتوى الدرس (سطران)",
  "questions": [
    {
      "level": 1,
      "type": "mcq",
      "text": "نص السؤال",
      "options": ["الخيار 1", "الخيار 2", "الخيار 3", "الخيار 4"],
      "correctIndex": 0,
      "bloom": "التذكّر",

      "explanation": "شرح تربوي مباشر للقاعدة أو المعلومة"
    }
  ]
}`;
    }

    function cleanNaturalArabic(str) {
      let s = String(str ?? '').trim();
      const roboticPrefixes = [
        /^(?:بناءً|بناء)\s+على\s+(?:الفقرة\s+(?:الأولى|الثانية|الثالثة|الرابعة|السابقة|المذكورة)\s+)?(?:في\s+)?(?:ورقة\s+العمل|النص\s+المرفق|الملف\s+المرفق|المحتوى\s+المرفق|الصورة\s+المرفقة|الدرس\s+المرفق|القطعة|الفقرة)[،,:؛\-\s]*/i,
        /^(?:استنادًا|استنادا|وفقًا|وفقا|طبقا|طبقًا|حسب|بحسب)\s+(?:إلى\s+|لـ\s*|ل)?(?:ورقة\s+العمل|النص\s+المرفق|الملف\s+المرفق|المحتوى\s+المرفق|الصورة\s+المرفقة|الفقرة\s+الأولى|الفقرة|النص)[،,:؛\-\s]*/i,
        /^(?:كما\s+)?(?:ورد|جاء|ذكر|يظهر)\s+في\s+(?:ورقة\s+العمل|النص\s+المرفق|الملف\s+المرفق|المحتوى\s+المرفق|الصورة\s+المرفقة|الفقرة\s+الأولى|الفقرة)[،,:؛\-\s]*/i
      ];
      for (const rx of roboticPrefixes) s = s.replace(rx, '').trim();
      if (s.length > 0) s = s.charAt(0).toUpperCase() + s.slice(1);
      return s;
    }

    function sanitizeQuiz(raw, metaOverrides = {}) {
      const subject = (metaOverrides.subject && metaOverrides.subject !== SUBJECT_OPTIONS[0])
        ? metaOverrides.subject
        : String(raw?.subject || 'مادّة دراسية').trim();
      const language = raw?.language === 'en' ? 'en' : 'ar';
      const lessonTitle = String(raw?.lessonTitle || 'درس غير معنون').trim();
      const sourceSummary = raw?.sourceSummary ? String(raw.sourceSummary).trim() : '';
      const qs = Array.isArray(raw?.questions) ? raw.questions : [];
      const questions = qs.map((q, idx) => {
        const level = Number(q?.level);
        if (![1, 2, 3].includes(level)) return null;
        const rawOpts = Array.isArray(q?.options) ? q.options.map(String).filter(s => s.trim() !== '') : [];
        if (rawOpts.length < 2) return null;
        const isTF = q?.type === 'tf' || rawOpts.length === 2;
        const options = isTF ? rawOpts.slice(0, 2) : rawOpts.slice(0, 4);
        if (!isTF) { while (options.length < 4) options.push('—'); }
        const ci = Number.isInteger(Number(q?.correctIndex)) && Number(q.correctIndex) >= 0 && Number(q.correctIndex) < options.length
          ? Number(q.correctIndex) : 0;
        return {
          id: `q-${idx}-${Date.now()}`,
          level,
          type: isTF ? 'tf' : 'mcq',
          text: cleanNaturalArabic(q?.text),
          options,
          correctIndex: ci,
          bloom: String(q?.bloom || '').trim(),
          dok: String(q?.dok || '').trim(),
          explanation: cleanNaturalArabic(q?.explanation)
        };
      }).filter(Boolean);

      if (questions.length === 0) throw new Error('لم يتمكن النموذج من استخراج أسئلة كافية من المحتوى المرفق.');
      return {
        id: 'quiz-' + Date.now().toString(36),
        isAvailable: true,
        stage: metaOverrides.stage || '',
        grade: metaOverrides.grade || '',
        subject,
        language,
        lessonTitle,
        sourceSummary,
        questions,
        createdAt: Date.now()
      };
    }

    async function callSingleModel(model, cleanKey, body, metaOverrides) {
      const cleanModel = model.replace(/^models\//, '');
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${cleanModel}:generateContent`;

      let response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cleanKey },
        body: JSON.stringify(body)
      });

      if (response.status === 401 || response.status === 403) {
        response = await fetch(`${endpoint}?key=${encodeURIComponent(cleanKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      }

      if (!response.ok) {
        let serverDetail = '';
        try {
          const errJson = await response.json();
          serverDetail = errJson?.error?.message || '';
        } catch {}
        const err = new Error(serverDetail || `HTTP ${response.status}`);
        err.status = response.status;
        throw err;
      }

      const data = await response.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!text) throw new Error('لم يتم استلام محتوى نصي من النموذج.');

      try {
        return sanitizeQuiz(JSON.parse(text), metaOverrides);
      } catch {
        const match = text.match(/\{[\s\S]*\}/);
        if (!match) throw new Error('تعذّر تحليل صيغة الاستجابة من النموذج.');
        return sanitizeQuiz(JSON.parse(match[0]), metaOverrides);
      }
    }

    async function discoverAvailableModels(cleanKey) {
      try {
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {
          headers: { 'x-goog-api-key': cleanKey }
        });
        if (!res.ok) return [];
        const data = await res.json();
        return (data.models || [])
          .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
          .map(m => m.name.replace(/^models\//, ''))
          .filter(name => name.includes('gemini') && !name.includes('embedding') && !name.includes('tts') && !name.includes('image'));
      } catch { return []; }
    }

    async function generateQuizFromFiles(files, apiKey, questionsPerLevel, primaryModel, metaOverrides, onStatus) {
      const cleanKey = (apiKey || '').trim();
      if (!cleanKey) throw new Error('يرجى إدخال مفتاح Gemini API أولاً من تبويب «الإعدادات والشجرة».');
      if (!files || files.length === 0) throw new Error('يرجى رفع ملف أو صورة الدرس أولاً.');

      const parts = [{ text: buildUniversalPrompt(questionsPerLevel, metaOverrides.subject, metaOverrides.stage, metaOverrides.grade) }];
      for (const f of files) {
        if (f.kind === 'image' || f.kind === 'pdf') {
          parts.push({ inlineData: { mimeType: f.kind === 'pdf' ? 'application/pdf' : f.mime, data: f.base64 } });
        } else if (f.text) {
          parts.push({ text: `محتوى الملف (${f.name}):\n\n${f.text}` });
        }
      }

      const body = {
        contents: [{ role: 'user', parts }],
        generationConfig: { responseMimeType: 'application/json', temperature: 0.2 }
      };

      const order = [primaryModel, ...GEMINI_MODELS.map(m => m.value).filter(m => m !== primaryModel)];
      let lastErr = null;

      for (let i = 0; i < order.length; i++) {
        try {
          return await callSingleModel(order[i], cleanKey, body, metaOverrides);
        } catch (err) {
          lastErr = err;
          if (err.status === 400 || err.status === 401 || err.status === 403) {
            throw new Error(`مشكلة في مصادقة المفتاح (رمز ${err.status}): ${err.message}`);
          }
          if (i < order.length - 1) {
            onStatus?.('جارٍ التحويل تلقائيًّا إلى الخادم البديل...');
            if (err.status === 429 || err.status === 503) await new Promise(r => setTimeout(r, 1200));
          }
        }
      }

      onStatus?.('جارٍ فحص النماذج المتاحة في حسابك تلقائيًّا...');
      const discovered = await discoverAvailableModels(cleanKey);
      const untried = discovered.filter(m => !order.includes(m));
      for (const m of untried.slice(0, 3)) {
        try { return await callSingleModel(m, cleanKey, body, metaOverrides); } catch (err) { lastErr = err; }
      }

      throw new Error(`تعذّر إكمال التوليد (${lastErr?.status ? 'رمز ' + lastErr.status : 'خطأ اتصال'}): ${lastErr?.message || 'حاول مرة أخرى بعد قليل.'}`);
    }

    function exportStandaloneStudentHTML(targetQuiz) {
      if (!targetQuiz) return;
      const safeQuiz = JSON.stringify(targetQuiz).replace(/<\/script>/gi, '<\\/script>');
      const cleanSettings = {
        ...state.settings,
        geminiApiKey: '',
        panelPassword: '',
        directUploadMode: false
      };
      const safeSettings = JSON.stringify(cleanSettings).replace(/<\/script>/gi, '<\\/script>');
      const safeRoster = JSON.stringify(state.roster).replace(/<\/script>/gi, '<\\/script>');

      let html = document.documentElement.outerHTML;
      html = html.replace(/<div id="app">[\s\S]*?<\/div>\s*<script>/, '<div id="app"></div>\n  <script>');
      const injection = `<script>window.__STUDENT_ONLY_MODE__=true;window.__EMBEDDED_QUIZ__=${safeQuiz};window.__EMBEDDED_SETTINGS__=${safeSettings};window.__EMBEDDED_ROSTER__=${safeRoster};<\/script>\n</body>`;
      html = html.replace(/<\/body>/i, injection);

      const safeName = (targetQuiz.lessonTitle || 'الدرس').replace(/[\\/:*?"<>|]+/g, '_');
      const blob = new Blob(['<!DOCTYPE html>\n' + html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `اختبار_الطلاب-${safeName}.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function exportResultsCSV() {
      const rows = loadResultsLog();
      if (!rows.length) return;
      const headers = ['التاريخ', 'اسم الطالب', 'المرحلة', 'الصف', 'الفصل', 'المادة', 'عنوان الدرس', 'المستوى الأول', 'المستوى الثاني', 'المستوى الثالث', 'الدرجة الكلية', 'النسبة المئوية'];
      const lines = [headers.join(',')];
      rows.forEach(r => {
        const vals = [
          `"${r.date || ''}"`, `"${r.studentName || ''}"`, `"${r.stage || ''}"`, `"${r.grade || ''}"`, `"${r.section || ''}"`,
          `"${r.subject || ''}"`, `"${r.lessonTitle || ''}"`, `"${r.lvl1 || ''}"`, `"${r.lvl2 || ''}"`, `"${r.lvl3 || ''}"`,
          `"${r.totalCorrect}/${r.totalQuestions}"`, `"${r.percentage}%"`
        ];
        lines.push(vals.join(','));
      });
      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `سجل_نتائج_الطلاب_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // ===================== 10. HELPERS =====================
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getGradesForStage(tree, stageName) {
      const st = (tree || []).find(s => s.name === stageName);
      return st && Array.isArray(st.grades) ? st.grades : [];
    }

    function getSectionsForGrade(tree, stageName, gradeName) {
      const grades = getGradesForStage(tree, stageName);
      const gr = grades.find(g => g.name === gradeName);
      return gr && Array.isArray(gr.sections) ? gr.sections : [];
    }

    function getAvailableQuizzesForStudent(stageName, gradeName) {
      return state.quizBank.filter(q => {
        if (q.isAvailable === false) return false;
        if (stageName && q.stage && q.stage !== stageName) return false;
        if (gradeName && q.grade && q.grade !== gradeName) return false;
        return true;
      });
    }

      const styleEl = document.getElementById('dynamic-print-style');
      if (!styleEl) return;
      if (state.phase === 'printExam') {
        styleEl.textContent = '@media print { @page { size: A4 portrait; margin: 12mm; } }';

        styleEl.textContent = '@media print { @page { size: A4 landscape; margin: 0; } }';
      }
    }

                  <div class="flex flex-wrap gap-2 justify-center">

                      ${svgIcon('upload', 16)} اختيار ملف
                    </button>
                    <button id="btn-direct-cam" ${busy ? 'disabled' : ''} class="px-4 py-2.5 rounded-xl bg-white border border-teal-200 text-teal-700 text-sm font-bold hover:bg-teal-50 flex items-center gap-2 disabled:opacity-60">
                      ${svgIcon('camera', 16)} التقاط صورة

                  ${pendingDirectQuiz ? `<p class="mt-3 text-center text-xs font-bold text-teal-800 bg-white/80 rounded-lg py-2">تم تجهيز اختبار (${esc(pendingDirectQuiz.subject)}): «${esc(pendingDirectQuiz.lessonTitle)}»</p>` : ''}
                  ${busy ? `<div class="flex items-center justify-center gap-2 mt-3 text-teal-700 text-sm"><span class="w-4 h-4 shrink-0 border-2 border-teal-200 border-t-teal-600 rounded-full animate-spin"></span> ${esc(statusMsg || 'جارٍ توليد اختبارك...')}</div>` : ''}

              <button id="btn-start-quiz" ${busy || (!directMode && !chosenQuiz) ? 'disabled' : ''}

    // --------------------- B. INTERACTIVE QUIZ VIEW ---------------------
    function renderQuiz() {
      const quiz = state.activeRunQuiz || state.activeQuiz;
      const { qIndex, selectedOption, revealed, answers, refDrawerOpen, refZoom, referenceAssets, quizFontScale, settings } = state;
      const questions = quiz.questions;
      const q = questions[qIndex];
      const isEn = quiz.language === 'en';
      const hasRef = referenceAssets.length > 0 || Boolean(quiz.sourceSummary);
      const readingCls = settings.readingFont === 'tajawal' ? 'font-reading-tajawal' : 'font-reading-naskh';

      const levelMeta = {
        1: { label: 'المستوى الأول', sub: 'السهل — التذكّر والفهم', badge: 'bg-teal-50 text-teal-700', cardActive: 'bg-teal-50 border-teal-200', text: 'text-teal-600', icon: 'brain' },
        2: { label: 'المستوى الثاني', sub: 'المتوسط — التطبيق والتحليل', badge: 'bg-gold-50 text-gold-700', cardActive: 'bg-gold-50 border-gold-200', text: 'text-gold-600', icon: 'grad' },
        3: { label: 'المستوى الثالث', sub: 'الأصعب — التقييم والابتكار', badge: 'bg-rose-50 text-rose-700', cardActive: 'bg-rose-50 border-rose-200', text: 'text-rose-600', icon: 'trophy' }
      };
      const meta = levelMeta[q.level];
      const correctCount = answers.filter(a => a.correct).length;
      const progress = (qIndex / questions.length) * 100;
      const letters = isEn ? ['A', 'B', 'C', 'D'] : ['أ', 'ب', 'ج', 'د'];

      const qFontSize = Math.round(22 * (quizFontScale / 100));
      const optFontSize = Math.round(18 * (quizFontScale / 100));
      const expFontSize = Math.round(16 * (quizFontScale / 100));

      return `
      <div class="min-h-screen flex flex-col bg-gradient-to-b from-ink-50 to-white">
        <div class="sticky top-0 z-20 glass border-b border-ink-100">
          <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-2 sm:gap-3">
            <button id="btn-quiz-exit" class="text-ink-500 hover:text-ink-800 p-1.5 rounded-lg hover:bg-ink-100" title="خروج">${svgIcon('x', 18)}</button>
            <div class="flex-1 min-w-0">
              <p class="text-xs text-ink-400 truncate">${quiz.subject ? `${esc(quiz.subject)} • ` : ''}${esc(quiz.lessonTitle)}</p>
              <div class="flex items-center gap-2">
                <span class="text-sm font-bold ${meta.text}">${meta.label}</span>
                <span class="text-xs text-ink-400 hidden sm:inline">•</span>
                <span class="text-xs text-ink-500 truncate hidden sm:inline">${meta.sub}</span>
              </div>
            </div>

            <div class="flex items-center gap-1 bg-white border border-ink-200 rounded-xl px-1.5 py-1">
              <button id="btn-qfont-down" class="px-1.5 py-0.5 rounded-lg text-xs font-bold text-ink-600 hover:bg-ink-100" title="تصغير الخط">أ-</button>
              <button id="btn-qfont-up" class="px-1.5 py-0.5 rounded-lg text-xs font-bold text-brand-700 hover:bg-brand-50" title="تكبير الخط">أ+</button>
            </div>

            ${hasRef ? `
              <button id="btn-open-ref" class="px-3 py-1.5 rounded-xl bg-brand-50 text-brand-700 border border-brand-200 text-xs font-bold hover:bg-brand-100 flex items-center gap-1.5">
                ${svgIcon('book', 15)} <span class="hidden sm:inline">مرجع الدرس</span>
              </button>
            ` : ''}
            <button id="btn-toggle-mute" class="p-2 rounded-lg hover:bg-ink-100 text-ink-500" title="الصوت">
              ${svgIcon(isAudioMuted ? 'volOff' : 'volOn', 18)}
            </button>
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white border border-ink-100">
              <span class="text-gold-500">${svgIcon('award', 15)}</span>
              <span class="text-sm font-bold text-ink-800">${correctCount}</span>
              <span class="text-xs text-ink-400">/ ${questions.length}</span>
            </div>
          </div>
          <div class="h-1.5 bg-ink-100">
            <div class="h-full bg-gradient-to-l from-brand-500 to-teal-500 transition-all duration-500" style="width: ${progress}%"></div>
          </div>
        </div>

        <div class="max-w-3xl w-full mx-auto px-4 pt-4">
          <div class="flex items-center gap-2">
            ${[1, 2, 3].map(lvl => {
              const m = levelMeta[lvl];
              const lvlQs = questions.filter(qq => qq.level === lvl);
              const lvlCorrect = answers.filter(a => a.correct && lvlQs.find(qq => qq.id === a.questionId)).length;
              const done = lvlQs.length > 0 && lvlQs.every(qq => answers.find(a => a.questionId === qq.id));
              const active = q.level === lvl;
              return `
                <div class="flex-1 rounded-xl p-2.5 border transition ${active ? m.cardActive : 'bg-white border-ink-100'}">
                  <div class="flex items-center gap-1.5">
                    <span class="${m.text}">${svgIcon(m.icon, 15)}</span>
                    <span class="text-xs font-bold ${active ? m.text : 'text-ink-500'}">${m.label}</span>
                  </div>
                  <div class="flex items-center justify-between mt-1">
                    <span class="text-[11px] text-ink-400">${done ? 'مكتمل' : active ? 'جارٍ' : 'منتظر'}</span>
                    <span class="text-[11px] font-bold text-ink-600">${lvlCorrect}/${lvlQs.length}</span>
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>

        <div class="flex-1 flex items-start justify-center px-4 py-6">
          <div class="w-full max-w-3xl">
            <div class="bg-white rounded-3xl shadow-soft p-6 sm:p-8 animate-fade-up">
              <div class="flex items-center justify-between mb-4">
                <span class="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-full ${meta.badge}">
                  ${svgIcon(meta.icon, 15)} ${meta.label}
                </span>
                <span class="text-xs font-semibold text-ink-400">سؤال ${qIndex + 1} من ${questions.length}</span>
              </div>

              <div class="flex flex-wrap gap-1.5 mb-4">
                ${q.bloom ? `<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-ink-100 text-ink-600">مستوى بلوم: ${esc(q.bloom)}</span>` : ''}
                ${q.dok ? `<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-ink-100 text-ink-600">عمق المعرفة: ${esc(q.dok)}</span>` : ''}
                ${q.type === 'tf' ? `<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-brand-50 text-brand-700">صواب / خطأ</span>` : ''}
              </div>

              <div dir="${isEn ? 'ltr' : 'rtl'}" class="${isEn ? 'text-left' : 'text-right'}">
                <h2 style="font-size: ${qFontSize}px;" class="${readingCls} font-bold text-ink-900 mb-6">${esc(q.text)}</h2>

                <div class="${q.type === 'tf' ? 'grid grid-cols-1 sm:grid-cols-2 gap-3' : 'space-y-3'}">
                  ${q.options.map((opt, idx) => {
                    const isCorrect = idx === q.correctIndex;
                    const isSelected = idx === selectedOption;
                    let cls = 'border-ink-200 bg-white hover:border-brand-300 hover:bg-brand-50/40 cursor-pointer';
                    let badgeCls = 'bg-ink-100 text-ink-600';
                    let badgeContent = letters[idx] || (idx + 1);
                    if (revealed) {
                      if (isCorrect) {
                        cls = 'border-teal-400 bg-teal-50 text-teal-900 cursor-default';
                        badgeCls = 'bg-teal-500 text-white';
                        badgeContent = svgIcon('check', 16);
                      } else if (isSelected) {
                        cls = 'border-rose-400 bg-rose-50 text-rose-900 cursor-default';
                        badgeCls = 'bg-rose-500 text-white';
                        badgeContent = svgIcon('x', 16);
                      } else {
                        cls = 'border-ink-100 bg-white opacity-60 cursor-default';
                      }
                    }
                    return `
                      <button data-opt-idx="${idx}" ${revealed ? 'disabled' : ''}
                        class="btn-quiz-opt w-full ${isEn ? 'text-left' : 'text-right'} px-4 py-4 rounded-2xl border-2 transition-all flex items-center gap-3.5 ${cls}">
                        <span class="shrink-0 w-8 h-8 rounded-lg grid place-items-center text-sm font-bold ${badgeCls}">${badgeContent}</span>
                        <span style="font-size: ${optFontSize}px;" class="flex-1 ${readingCls} font-semibold">${esc(opt)}</span>
                      </button>`;
                  }).join('')}
                </div>

                ${revealed ? `
                  <div class="mt-5 rounded-2xl bg-brand-50/70 border border-brand-100 p-4 animate-fade-up">
                    <div class="flex items-center gap-2 text-brand-700 mb-1.5">
                      ${svgIcon('lightbulb', 17)}
                      <span class="text-xs font-bold">${isEn ? 'Pedagogical Explanation' : 'التفسير التربويّ'}</span>
                    </div>
                    <p style="font-size: ${expFontSize}px;" class="${readingCls} text-ink-800">${esc(q.explanation)}</p>
                    <p dir="rtl" class="text-right text-sm font-bold mt-2.5 ${selectedOption === q.correctIndex ? 'text-teal-700' : 'text-rose-600'}">
                      ${selectedOption === q.correctIndex ? 'إجابة صحيحة، أحسنت!' : `الإجابة الصحيحة: ${esc(q.options[q.correctIndex])}`}
                    </p>
                  </div>
                ` : ''}
              </div>

              ${revealed ? `
                <button id="btn-next-q"
                  class="mt-5 w-full py-3.5 rounded-xl bg-ink-800 text-white font-bold text-base flex items-center justify-center gap-2 hover:bg-ink-900 transition animate-fade-up">
                  ${qIndex + 1 >= questions.length ? 'إنهاء وعرض الشهادة' : 'السؤال التالي'} ${svgIcon('arrowLeft', 18)}
                </button>
              ` : ''}
            </div>
          </div>
        </div>

        ${refDrawerOpen ? `
          <div class="fixed inset-0 z-50 flex">
            <div id="ref-backdrop" class="absolute inset-0 bg-ink-900/40 backdrop-blur-sm"></div>
            <div class="relative ms-auto h-full w-full max-w-xl bg-white shadow-lift flex flex-col animate-fade-up">
              <div class="flex items-center justify-between px-5 py-3.5 border-b border-ink-100">
                <div class="flex items-center gap-2 text-brand-700">
                  ${svgIcon('book', 18)}
                  <h3 class="font-display font-bold text-ink-800">مرجع الدرس المرفق</h3>
                </div>
                <div class="flex items-center gap-1.5">
                  <button id="btn-ref-zout" class="p-1.5 rounded-lg border border-ink-200 text-ink-600 hover:bg-ink-100">${svgIcon('zoomOut', 15)}</button>
                  <span class="text-xs font-semibold text-ink-500 w-10 text-center">${refZoom}%</span>
                  <button id="btn-ref-zin" class="p-1.5 rounded-lg border border-ink-200 text-ink-600 hover:bg-ink-100">${svgIcon('zoomIn', 15)}</button>
                  <button id="btn-close-ref" class="p-1.5 rounded-lg hover:bg-ink-100 text-ink-500 mr-2">${svgIcon('x', 19)}</button>
                </div>
              </div>
              <div class="flex-1 overflow-auto p-5 space-y-4 bg-ink-50">
                ${quiz.sourceSummary ? `
                  <div class="bg-white rounded-2xl border border-ink-100 p-4">
                    <p class="text-xs font-bold text-brand-700 mb-1">ملخّص الدرس</p>
                    <p class="${readingCls} text-base text-ink-800">${esc(quiz.sourceSummary)}</p>
                  </div>
                ` : ''}
                ${referenceAssets.map(asset => `
                  <div class="bg-white rounded-2xl border border-ink-100 p-3">
                    <p class="text-xs font-semibold text-ink-500 mb-2">${esc(asset.name)}</p>
                    ${asset.kind === 'image' && asset.dataUrl
                      ? `<div class="overflow-auto"><img src="${asset.dataUrl}" style="width: ${refZoom}%;" class="rounded-xl mx-auto transition-all" /></div>`
                      : asset.text
                        ? `<pre style="font-size: ${Math.max(14, Math.round(16 * refZoom / 100))}px;" class="whitespace-pre-wrap ${readingCls} text-ink-900 bg-ink-50 p-4 rounded-xl">${esc(asset.text)}</pre>`
                        : `<p class="text-xs text-ink-400">ملف PDF مرفق: ${esc(asset.name)}</p>`}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        ` : ''}
      </div>`;
    }

    // ===================== 12. EVENT BINDINGS =====================
    function bindEvents() {
      const tree = state.settings.academicTree || [];

      const selStStage = document.getElementById('sel-st-stage');
      if (selStStage) selStStage.onchange = e => {
        state.student.stage = e.target.value;
        const grs = getGradesForStage(tree, state.student.stage);
        state.student.grade = grs[0]?.name || '';
        state.student.section = grs[0]?.sections?.[0] || '';
        state.student.selectedFromList = '';
        render();
      };

      const selStGrade = document.getElementById('sel-st-grade');
      if (selStGrade) selStGrade.onchange = e => {
        state.student.grade = e.target.value;
        const secs = getSectionsForGrade(tree, state.student.stage, state.student.grade);
        state.student.section = secs[0] || '';
        state.student.selectedFromList = '';
        render();
      };

      const selStSection = document.getElementById('sel-st-section');
      if (selStSection) selStSection.onchange = e => {
        state.student.section = e.target.value;
        state.student.selectedFromList = '';
        render();
      };

      const selStNameList = document.getElementById('sel-st-name-list');
      if (selStNameList) selStNameList.onchange = e => {
        state.student.selectedFromList = e.target.value;
        render();
      };

      const inpStTypedName = document.getElementById('inp-st-typed-name');
      if (inpStTypedName) inpStTypedName.oninput = e => {
        state.student.typedName = e.target.value;
      };

      const selAvailQuiz = document.getElementById('sel-available-quiz');
      if (selAvailQuiz) selAvailQuiz.onchange = e => {
        state.selectedQuizId = e.target.value;
        render();
      };

      const btnStart = document.getElementById('btn-start-quiz');
      if (btnStart) btnStart.onclick = async () => {
        state.touched = true;
        const classStudents = state.roster[rosterKey(state.student.stage, state.student.grade, state.student.section)] || [];
        const hasClassList = classStudents.length > 0;
        const wasUnlisted = hasClassList && state.student.selectedFromList === '__UNLISTED__';
        const finalName = (!hasClassList || wasUnlisted) ? state.student.typedName.trim() : state.student.selectedFromList.trim();

        const directMode = state.settings.directUploadMode && !IS_STUDENT_EXPORT;
        const matchingQuizzes = getAvailableQuizzesForStudent(state.student.stage, state.student.grade);
        const targetQuiz = directMode
          ? state.pendingDirectQuiz
          : (matchingQuizzes.find(q => q.id === state.selectedQuizId) || matchingQuizzes[0]);

        if (!state.student.stage || !state.student.grade || !state.student.section || !finalName || !targetQuiz) {
          render();
          return;
        }

        if (wasUnlisted) {
          const unlistedEntry = {
            id: Date.now(),
            typedName: finalName,
            stage: state.student.stage,
            grade: state.student.grade,
            section: state.student.section,
            resolved: false
          };
          state.unlistedStudents.unshift(unlistedEntry);
          saveUnlisted(state.unlistedStudents);
          const fbBase = normalizeFirebaseUrl(state.settings.firebaseUrl);
          if (fbBase) {
            fbRequest(fbBase, 'unlistedStudents', 'POST', unlistedEntry).catch(() => {});
          }
        }

        sfx.click();
        state.student.finalName = finalName;
        state.student.wasUnlisted = wasUnlisted;
        state.activeQuiz = targetQuiz;
        state.activeRunQuiz = buildShuffledRunQuiz(targetQuiz);
        state.qIndex = 0;
        state.selectedOption = null;
        state.revealed = false;
        state.answers = [];
        state.phase = 'quiz';
        render();
      };

      const btnDirectFile = document.getElementById('btn-direct-file');
      const inpDirectFile = document.getElementById('inp-direct-file');
      if (btnDirectFile && inpDirectFile) {
        btnDirectFile.onclick = () => inpDirectFile.click();
        inpDirectFile.onchange = async e => {
          const files = e.target.files;
          if (!files || !files.length) return;
          state.errorMsg = '';
          state.busy = true;
          state.statusMsg = 'جارٍ قراءة الملف وتحليله...';
          render();
          try {
            const ingested = [];
            for (const f of Array.from(files)) ingested.push(await ingestFile(f));
            state.referenceAssets = ingested.map(f => ({ name: f.name, kind: f.kind, dataUrl: f.dataUrl, text: f.text }));
            const generated = await generateQuizFromFiles(
              ingested, state.settings.geminiApiKey, state.settings.questionsPerLevel, state.settings.geminiModel,
              { subject: SUBJECT_OPTIONS[0], stage: state.student.stage, grade: state.student.grade },
              msg => { state.statusMsg = msg; render(); }
            );
            sfx.click();
            state.pendingDirectQuiz = generated;
          } catch (err) {
            state.errorMsg = err.message || 'تعذّر توليد الاختبار.';
          } finally {
            state.busy = false;
            state.statusMsg = '';
            render();
          }
        };
      }
      const btnDirectCam = document.getElementById('btn-direct-cam');
      const inpDirectCam = document.getElementById('inp-direct-cam');
      if (btnDirectCam && inpDirectCam) {
        btnDirectCam.onclick = () => inpDirectCam.click();
        inpDirectCam.onchange = inpDirectFile ? inpDirectFile.onchange : null;
      }

      const btnFontUp = document.getElementById('btn-qfont-up');
      const btnFontDown = document.getElementById('btn-qfont-down');
      if (btnFontUp) btnFontUp.onclick = () => { state.quizFontScale = Math.min(130, state.quizFontScale + 15); render(); };
      if (btnFontDown) btnFontDown.onclick = () => { state.quizFontScale = Math.max(100, state.quizFontScale - 15); render(); };

      const btnExit = document.getElementById('btn-quiz-exit');
      if (btnExit) btnExit.onclick = () => { state.phase = 'onboarding'; state.refDrawerOpen = false; render(); };

      const btnMute = document.getElementById('btn-toggle-mute');

        render();
      };
      const selResSec = document.getElementById('sel-resolve-section');
      if (selResSec) selResSec.onchange = e => { state.resolveSection = e.target.value; };

      const btnCancelRes = document.getElementById('btn-cancel-resolve');
      if (btnCancelRes) btnCancelRes.onclick = () => { state.resolvingUnlistedId = null; render(); };

      document.querySelectorAll('.btn-confirm-resolve').forEach(b => {
        b.onclick = () => {
          const id = Number(b.getAttribute('data-confirm-resolve'));
          const item = state.unlistedStudents.find(u => u.id === id);
          const approvedName = state.resolveEditName.trim();
          if (!item || !approvedName) return;

          const k = rosterKey(state.resolveStage, state.resolveGrade, state.resolveSection);
          const existing = state.roster[k] || [];
          state.roster[k] = Array.from(new Set([...existing, approvedName]));
          saveRoster(state.roster);

          const logs = loadResultsLog().map(r => {
            if (r.studentName === item.typedName && r.grade === item.grade && r.section === item.section) {
              return { ...r, studentName: approvedName, stage: state.resolveStage, grade: state.resolveGrade, section: state.resolveSection, wasUnlisted: false };
            }
            return r;
          });
          localStorage.setItem(RESULTS_KEY, JSON.stringify(logs));

          state.unlistedStudents = state.unlistedStudents.filter(u => u.id !== id);
          saveUnlisted(state.unlistedStudents);
          state.resolvingUnlistedId = null;

          const fbBase = normalizeFirebaseUrl(state.settings.firebaseUrl);
          if (fbBase) {
            if (item.fbKey) fbRequest(fbBase, `unlistedStudents/${item.fbKey}`, 'DELETE').catch(() => {});
            syncAllToFirebase();
          }

          sfx.click();
          render();
        };
      });

      document.querySelectorAll('.btn-dismiss-unlisted').forEach(b => {
        b.onclick = () => {
          const id = Number(b.getAttribute('data-dismiss-unlisted'));
          const item = state.unlistedStudents.find(u => u.id === id);
          state.unlistedStudents = state.unlistedStudents.filter(u => u.id !== id);
          saveUnlisted(state.unlistedStudents);
          const fbBase = normalizeFirebaseUrl(state.settings.firebaseUrl);
          if (fbBase && item?.fbKey) fbRequest(fbBase, `unlistedStudents/${item.fbKey}`, 'DELETE').catch(() => {});
          render();
        };
      });

      const btnExportCsv = document.getElementById('btn-export-csv');
      if (btnExportCsv) btnExportCsv.onclick = () => { sfx.click(); exportResultsCSV(); };

      const btnClearResults = document.getElementById('btn-clear-results');
      if (btnClearResults) btnClearResults.onclick = () => { clearResultsLog(); render(); };

      const d = state.draftSettings;
      if (d) {
        const bindVal = (id, key) => { const el = document.getElementById(id); if (el) el.oninput = e => { d[key] = e.target.value; }; };
        bindVal('inp-firebase-url', 'firebaseUrl');
        bindVal('inp-api-key', 'geminiApiKey');
        bindVal('inp-inst-header', 'institutionHeader');
        bindVal('inp-welcome-banner', 'welcomeBanner');
        bindVal('inp-r1-title', 'role1Title');
        bindVal('inp-r1-name', 'role1Name');
        bindVal('inp-r2-title', 'role2Title');
        bindVal('inp-r2-name', 'role2Name');
        bindVal('inp-r3-title', 'role3Title');
        bindVal('inp-r3-name', 'role3Name');
        bindVal('inp-footer-text', 'footerText');
        bindVal('inp-new-pwd', 'panelPassword');

        const btnToggleKey = document.getElementById('btn-toggle-key');
        if (btnToggleKey) btnToggleKey.onclick = () => { state.showKey = !state.showKey; render(); };

        const selModel = document.getElementById('sel-gemini-model');
        if (selModel) selModel.onchange = e => { d.geminiModel = e.target.value; };

        const selFont = document.getElementById('sel-reading-font');
        if (selFont) selFont.onchange = e => { d.readingFont = e.target.value; };

        const qRange = document.getElementById('inp-q-per-lvl');
        if (qRange) qRange.oninput = e => { d.questionsPerLevel = Number(e.target.value); render(); };

        const btnDirect = document.getElementById('btn-toggle-direct');
        if (btnDirect) btnDirect.onclick = () => { d.directUploadMode = !d.directUploadMode; render(); };

        const btnSchoolLogo = document.getElementById('btn-up-school-logo');
        const inpSchoolLogo = document.getElementById('inp-school-logo');
        if (btnSchoolLogo && inpSchoolLogo) {
          btnSchoolLogo.onclick = () => inpSchoolLogo.click();
          inpSchoolLogo.onchange = async e => {
            if (e.target.files?.[0]) {
              const { dataUrl } = await fileToBase64(e.target.files[0]);
              d.schoolLogo = dataUrl;
              render();
            }
          };
        }
        const rmSchoolLogo = document.getElementById('btn-rm-school-logo');
        if (rmSchoolLogo) rmSchoolLogo.onclick = () => { d.schoolLogo = null; render(); };

        const btnTeacherLogo = document.getElementById('btn-up-teacher-logo');
        const inpTeacherLogo = document.getElementById('inp-teacher-logo');
        if (btnTeacherLogo && inpTeacherLogo) {
          btnTeacherLogo.onclick = () => inpTeacherLogo.click();
          inpTeacherLogo.onchange = async e => {
            if (e.target.files?.[0]) {
              const { dataUrl } = await fileToBase64(e.target.files[0]);
              d.teacherLogo = dataUrl;
              render();
            }
          };
        }
        const rmTeacherLogo = document.getElementById('btn-rm-teacher-logo');
        if (rmTeacherLogo) rmTeacherLogo.onclick = () => { d.teacherLogo = null; render(); };

        const inpNewStage = document.getElementById('inp-new-stage');
        if (inpNewStage) inpNewStage.oninput = e => { state.newStageName = e.target.value; };

        const btnAddStage = document.getElementById('btn-add-stage');
        if (btnAddStage) btnAddStage.onclick = () => {
          const nm = state.newStageName.trim();
          if (!nm) return;
          d.academicTree.push({ id: 'stg-' + Date.now(), name: nm, grades: [] });
          state.newStageName = '';
          render();
        };

        document.querySelectorAll('.btn-del-stage').forEach(b => {
          b.onclick = () => {
            const idx = Number(b.getAttribute('data-del-stage'));
            d.academicTree.splice(idx, 1);
            render();
          };
        });

        document.querySelectorAll('.btn-add-grade').forEach(b => {
          b.onclick = () => {
            const sIdx = Number(b.getAttribute('data-add-grade'));
            const inp = document.querySelector(`.inp-inline-grade[data-grade-inp="${sIdx}"]`);
            const nm = inp?.value.trim();
            if (!nm) return;
            d.academicTree[sIdx].grades.push({ id: 'grd-' + Date.now(), name: nm, sections: ['أ', 'ب'] });
            render();
          };
        });

        document.querySelectorAll('.btn-del-grade').forEach(b => {
          b.onclick = () => {
            const [sIdx, gIdx] = b.getAttribute('data-del-grade').split(':').map(Number);
            d.academicTree[sIdx].grades.splice(gIdx, 1);
            render();
          };
        });

        document.querySelectorAll('.btn-add-sec').forEach(b => {
          b.onclick = () => {
            const [sIdx, gIdx] = b.getAttribute('data-add-sec').split(':').map(Number);
            const inp = document.querySelector(`.inp-inline-sec[data-sec-inp="${sIdx}:${gIdx}"]`);
            const nm = inp?.value.trim();
            if (!nm) return;
            const secs = d.academicTree[sIdx].grades[gIdx].sections;
            if (!secs.includes(nm)) secs.push(nm);
            render();
          };
        });

        document.querySelectorAll('.btn-del-sec').forEach(b => {
          b.onclick = () => {
            const [sIdx, gIdx, secIdx] = b.getAttribute('data-del-sec').split(':').map(Number);
            d.academicTree[sIdx].grades[gIdx].sections.splice(secIdx, 1);
            render();
          };
        });
      }

      const btnSaveSettings = document.getElementById('btn-save-settings');
      if (btnSaveSettings) btnSaveSettings.onclick = async () => {
        state.settings = JSON.parse(JSON.stringify(state.draftSettings));
        saveSettings(state.settings);

        const t = state.settings.academicTree;
        if (t.length > 0 && !t.some(s => s.name === state.student.stage)) {
          state.student.stage = t[0].name;
          state.student.grade = t[0].grades?.[0]?.name || '';
          state.student.section = t[0].grades?.[0]?.sections?.[0] || '';
        }

        if (normalizeFirebaseUrl(state.settings.firebaseUrl)) {
          await syncAllToFirebase();
        }

        state.savedToast = true;
        sfx.click();
        render();
        setTimeout(() => { state.savedToast = false; render(); }, 1800);
      };
    }

    // ===================== 13. INITIAL BOOT =====================
    (async function bootApp() {
      const params = new URLSearchParams(window.location.search);
      const targetQuizId = params.get('quiz');
      if (targetQuizId) {
        const localMatch = state.quizBank.find(q => q.id === targetQuizId);
        if (localMatch) {
          state.selectedQuizId = localMatch.id;
          if (localMatch.stage) state.student.stage = localMatch.stage;
          if (localMatch.grade) state.student.grade = localMatch.grade;
        }
      }
      render();
      await pullCloudDataForStudent(targetQuizId);
      render();
    })();
  </script>
</body>
</html>
